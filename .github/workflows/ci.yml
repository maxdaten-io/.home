name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read

jobs:
  check-flake:
    name: Check Flake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      # --no-build: `checks.statusline` is defined for all four systems in
      # modules/flake/systems.nix, so building every system's checks always hits
      # a platform mismatch on whichever runner we use. Evaluate all systems
      # here, then build the checks this runner can actually build.
      - name: Check flake
        run: nix flake check --all-systems --no-build --show-trace

      - name: Run checks buildable on this runner
        run: nix build .#checks.x86_64-linux.statusline -L

  check-formatting:
    name: Check Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Install devenv.sh
        run: nix profile install nixpkgs#devenv

      - name: Check formatting with treefmt
        run: devenv shell treefmt --fail-on-change
